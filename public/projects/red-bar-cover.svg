    <circle cx="290" cy="232" r="4" fill="#fb923c" stroke="none"/>
  </g>

  <!-- nodo superior derecho, TPV -->
  <g>
    <rect x="810" y="110" width="200" height="140" rx="16" fill="#0f1629" stroke="#2a3552" stroke-width="3"/>
    <rect x="850" y="135" width="120" height="70" rx="8" stroke="#e8ecf5" stroke-width="3"/>
    <path d="M850 160 H970" stroke="#e8ecf5" stroke-width="3"/>
