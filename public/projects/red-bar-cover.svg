<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <rect width="1200" height="630" fill="#0a0f1c"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#glow)"/>
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6">
