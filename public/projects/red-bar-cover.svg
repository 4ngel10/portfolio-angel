  </defs>

  <!-- enlaces: una línea por red -->
  <g stroke="#fb923c" stroke-width="3" stroke-dasharray="2 10">
    <path d="M520 275 L330 180"/>
    <path d="M680 275 L870 180"/>
    <path d="M520 355 L330 450"/>
    <path d="M680 355 L870 450"/>
  </g>

  <!-- router central -->
  <rect x="490" y="250" width="220" height="130" rx="16" fill="#0f1629" stroke="#fb923c" stroke-width="3"/>
  <path d="M520 340 H680" stroke="#2a3552" stroke-width="3"/>
  <circle cx="530" cy="361" r="5" fill="#fb923c" stroke="none"/>
  <circle cx="554" cy="361" r="5" fill="#fb923c" stroke="none"/>
  <circle cx="578" cy="361" r="5" fill="#2a3552" stroke="none"/>
  <path d="M570 300 a42 42 0 0 1 60 0" stroke="#e8ecf5" stroke-width="3"/>
  <path d="M580 311 a28 28 0 0 1 40 0" stroke="#e8ecf5" stroke-width="3"/>
  <circle cx="600" cy="322" r="4" fill="#e8ecf5" stroke="none"/>

