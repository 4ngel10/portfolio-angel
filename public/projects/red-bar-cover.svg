    <rect x="810" y="380" width="200" height="140" rx="16" fill="#0f1629" stroke="#2a3552" stroke-width="3"/>
    <rect x="850" y="410" width="120" height="72" rx="8" stroke="#e8ecf5" stroke-width="3"/>
